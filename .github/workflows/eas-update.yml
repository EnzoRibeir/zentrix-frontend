name: Publish Zentrix 24/7 (EAS Update + Web Build Check)

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build Web PWA & Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Build Web PWA bundle
        run: npm run build:web

      - name: Setup Expo and EAS (runs if EXPO_TOKEN secret is configured)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish 24/7 Cloud Bundle for Expo Go (iOS & Android)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas update --branch production --environment production --message "${{ github.event.head_commit.message }}" --non-interactive
